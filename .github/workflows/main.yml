name: contribution-graph
on:
  schedule:
    # Runs just after the window closes: 20:40 UTC = 02:10 IST, Mon–Sat UTC (never Sunday).
    - cron: '40 20 * * 1-6'
  workflow_dispatch:          # adds a manual "Run workflow" button for testing

jobs:
  commits:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Make 6-16 commits at random times between 17:30 and 20:30 UTC (11 PM - 2 AM IST)
        env:
          GIT_NAME: ${{ github.repository_owner }}
          GIT_EMAIL: ${{ secrets.GIT_EMAIL }}
          MIN_COMMITS: 6
          MAX_COMMITS: 16
          WINDOW_START: '17:30:00'  # UTC (23:00 IST)
          WINDOW_END: '20:30:00'    # UTC (02:00 IST)
        run: bash .github/scripts/commit.sh
